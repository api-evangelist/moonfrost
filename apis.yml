description: 'MoonFrost is a cozy life-sim RPG developed by Oxalis Games Ltd., set in a world ravaged
  by constant meteor storms where players farm, fish, craft, and build their dream home. Positioned as
  a Web3 game, it is backed by crypto investor Pantera Capital and is available to wishlist on Steam and
  the Epic Games Store, with a community on Discord. As of this profile, MoonFrost publishes no public
  API, developer documentation, SDK, or developer portal — it is a consumer game rather than an API
  provider, so this record is identity-only pending any future developer surface.'
